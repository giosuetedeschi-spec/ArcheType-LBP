services:
  db:
    image: postgres:18-alpine
    container_name: archetype-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: archetype
      POSTGRES_USER: archetype
      POSTGRES_PASSWORD: archetype_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archetype -d archetype"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archetype-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      populate:
        condition: service_completed_successfully
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/archetype
      SPRING_DATASOURCE_USERNAME: archetype
      SPRING_DATASOURCE_PASSWORD: archetype_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5177,http://127.0.0.1:5177,http://frontend:80
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./virtualz-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080/api
    container_name: virtualz-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

  # Popola il database dal dataset Steam. Gira ad ogni "docker compose up"
  # ma si auto-salta (exit rapido) se il database e' gia' popolato, quindi
  # non rallenta gli avvii successivi al primo. Il backend attende il suo
  # completamento (vedi depends_on sopra) per non partire con un catalogo
  # vuoto durante il primo import. Vedi scripts/populate_db.py per la
  # logica di skip e FORCE_REPOPULATE.
  populate:
    build:
      context: ./scripts
      dockerfile: Dockerfile
    container_name: archetype-populate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: archetype
      DB_USER: archetype
      DB_PASSWORD: archetype_secret
      STEAM_DATASET_PATH: /data/games.csv
      FORCE_REPOPULATE: ${FORCE_REPOPULATE:-false}
    volumes:
      - ./data:/data:ro

volumes:
  pgdata:
