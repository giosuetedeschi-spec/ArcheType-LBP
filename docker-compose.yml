version: "3.9"

services:
  db:
    image: postgres:17-alpine
    container_name: archetype-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: archetype
      POSTGRES_USER: archetype
      POSTGRES_PASSWORD: archetype_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U archetype -d archetype"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: archetype-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/archetype
      SPRING_DATASOURCE_USERNAME: archetype
      SPRING_DATASOURCE_PASSWORD: archetype_secret
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5177,http://127.0.0.1:5177,http://frontend:80
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./archetype-frontend
      dockerfile: Dockerfile
    container_name: archetype-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8080/api

  populate:
    build:
      context: ./populate
      dockerfile: Dockerfile
    container_name: archetype-populate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: archetype
      DB_USER: archetype
      DB_PASSWORD: archetype_secret
      STEAM_DATASET_PATH: /data/games.csv
    volumes:
      - ./data:/data:ro
    profiles:
      - init

volumes:
  pgdata:
