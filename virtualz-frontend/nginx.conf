server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tutte le route non-file vanno reindirizzate a index.html,
    # così react-router-dom gestisce il routing client-side
    # (es. /games/123, /library) senza 404 al refresh della pagina.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache lunga per gli asset con hash nel nome (generati da Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
