name: Frontend TypeScript Linting

on:
  push:
    branches:
      - main
    paths:
      - 'virtualz-frontend/**'
      - '.github/workflows/frontend-lint.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'virtualz-frontend/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./virtualz-frontend
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './virtualz-frontend/package-lock.json'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run TypeScript type check
        run: npx tsc --noEmit
      
      - name: Run OxLint
        run: npm run lint
