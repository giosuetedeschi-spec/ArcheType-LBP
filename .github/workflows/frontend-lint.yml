name: Frontend Lint

on:
  push:
    branches: [main]
    paths:
      - "virtualz-frontend/**"
      - ".github/workflows/frontend-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "virtualz-frontend/**"
      - ".github/workflows/frontend-lint.yml"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtualz-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: virtualz-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
