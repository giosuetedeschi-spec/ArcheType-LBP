name: Frontend Typecheck

on:
  push:
    branches: [main]
    paths:
      - "virtualz-frontend/**"
      - ".github/workflows/frontend-typecheck.yml"
  pull_request:
    branches: [main]
    paths:
      - "virtualz-frontend/**"
      - ".github/workflows/frontend-typecheck.yml"

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: virtualz-frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: virtualz-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
