spring.application.name=archetype-lbp

# Database (i default sono per lo sviluppo locale via docker-compose;
# sovrascrivibili con le omonime env var SPRING_DATASOURCE_* per qualunque
# altro ambiente, senza toccare questo file — issue #85)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/archetype}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:archetype}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:archetype_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# CORS (incluse le porte del frontend attivo e del nuovo VirtualZ)
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5177,http://127.0.0.1:5177,http://frontend:80

# Logging
logging.level.com.archetype=DEBUG
logging.level.org.springframework.web=INFO

# JWT (default valido solo per sviluppo locale — sovrascrivere JWT_SECRET
# in ogni altro ambiente, issue #85)
jwt.secret=${JWT_SECRET:archetype-super-secret-key-change-this-in-production-min-256-bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Flyway — migrazioni schema versionate
# baseline-on-migrate: accetta DB esistenti senza flyway_schema_history
# (necessario per i volumi dev già popolati con init.sql diretto)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# ==========================================
# Google OAuth2 Config (Issue #102)
# ==========================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-placeholder-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-placeholder-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google