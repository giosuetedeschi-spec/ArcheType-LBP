spring.application.name=archetype-lbp

# Database (i default sono per lo sviluppo locale via docker-compose;
# sovrascrivibili con le omonime env var SPRING_DATASOURCE_* per qualunque
# altro ambiente, senza toccare questo file — issue #85)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://db:5432/archetype}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:archetype}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:archetype_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8080

# CORS (incluse le porte del frontend attivo e del nuovo VirtualZ)
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5177,http://127.0.0.1:5177,http://frontend:80

# Logging
logging.level.com.archetype=DEBUG
logging.level.org.springframework.web=INFO

# JWT (default valido solo per sviluppo locale — sovrascrivere JWT_SECRET
# in ogni altro ambiente, issue #85)
jwt.secret=${JWT_SECRET:archetype-super-secret-key-change-this-in-production-min-256-bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# Flyway — migrazioni schema versionate
# baseline-on-migrate: accetta DB esistenti senza flyway_schema_history
# (necessario per i volumi dev già popolati con init.sql diretto)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# Login Steam (docs/OAUTH_LOGIN_PLAN.md, issue #102). Nessun default reale
# per la chiave API: senza questa env var il login Steam non funziona, ma
# l'app si avvia comunque (il login classico non dipende da questa sezione)
# — va procurata da https://steamcommunity.com/dev/apikey.
steam.api.key=${STEAM_API_KEY:}

# Base URL di backend/frontend usate per costruire i redirect Steam
# (return_to dell'OpenID, redirect finale col token verso la SPA) — vanno
# sovrascritte in ogni ambiente diverso da sviluppo locale.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
