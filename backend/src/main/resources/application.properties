spring.application.name=archetype-lbp
# Database
spring.datasource.url=jdbc:postgresql://db:5432/archetype
spring.datasource.username=archetype
spring.datasource.password=archetype_secret
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# Server
server.port=8080
# CORS
cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://localhost:5174,http://frontend:80
# Logging
logging.level.com.archetype=DEBUG
logging.level.org.springframework.web=INFO
# JWT
jwt.secret=archetype-super-secret-key-change-this-in-production-min-256-bits
jwt.expiration-ms=86400000
